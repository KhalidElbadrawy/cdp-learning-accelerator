:root {
  color-scheme: dark;
  --ink: #0D0F10;
  --surface: rgba(255,255,255,.045);
  --surface-2: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.12);
  --line-soft: rgba(255,255,255,.07);
  --text: #F5F7FA;
  --muted: rgba(255,255,255,.72);
  --faint: rgba(255,255,255,.55);
  --blue: #0095FF;
  --blue-hover: #0077CC;
  --blue-soft: #66BEFF;
  --blue-pale: #9BD8FF;
  --violet: #6C63FF;
  --quantum: #E943E9;
  --quantum-deep: #A02B93;
  --quantum-pale: #F5A3F5;
  --essential: #D0DBE6;
  --done: #4EA72E;
  --font: 'Noto Kufi Arabic', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --radius: 16px;
  --radius-s: 10px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 2px; }
a { color: var(--blue-soft); }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.tabular { font-variant-numeric: tabular-nums; }

/* ---- shell ---- */
.app { display: flex; min-height: 100%; background: var(--ink); background-image: radial-gradient(90% 46% at 100% 100%, rgba(0,149,255,.26) 0%, rgba(0,176,240,.12) 44%, rgba(13,15,16,0) 76%); background-attachment: fixed; }
.side { width: 264px; flex: 0 0 264px; padding: 26px 18px 30px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow: auto;
  background-image: radial-gradient(130% 62% at 108% 92%, rgba(0,149,255,.36) 0%, rgba(108,99,255,.18) 40%, rgba(13,15,16,0) 72%); border-right: 1px solid var(--line-soft); }
.brand { display: flex; flex-direction: column; gap: 10px; }
.brand-name { font-size: 24px; font-weight: 300; font-style: italic; line-height: 1.1; letter-spacing: -.02em; background: none; border: 0; padding: 0; text-align: left; color: #fff; }
.brand-name b { font-weight: 600; }
/* Brand arrow: the trend line draws itself, the arrowhead follows, then every few seconds the
   arrow nudges up and to the right with a soft glow. --bm-t keeps it in step across redraws. */
.brand-mark { overflow: visible; }
.brand-mark .bm-line { stroke-dasharray: 28; stroke-dashoffset: 28; animation: bm-draw .9s cubic-bezier(.65,0,.35,1) calc(var(--bm-t, 0ms) + 250ms) forwards; }
.brand-mark .bm-head { stroke-dasharray: 12; stroke-dashoffset: 12; animation: bm-draw .35s ease-out calc(var(--bm-t, 0ms) + 1000ms) forwards; }
.brand-mark .bm-nudge { animation: bm-nudge 6s ease-in-out calc(var(--bm-t, 0ms) + 1600ms) infinite; }
@keyframes bm-draw { to { stroke-dashoffset: 0; } }
@keyframes bm-nudge {
  0%, 78%, 100% { transform: translate(0, 0); filter: none; }
  86% { transform: translate(1.6px, -1.6px); filter: drop-shadow(0 0 3px rgba(102,190,255,.9)); }
  93% { transform: translate(0, 0); filter: drop-shadow(0 0 1px rgba(102,190,255,.4)); }
}
@media (prefers-reduced-motion: reduce) {
  .brand-mark .bm-line, .brand-mark .bm-head { animation: none; stroke-dashoffset: 0; }
  .brand-mark .bm-nudge { animation: none; }
}
.badge-v { align-self: flex-start; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(0,149,255,.45); background: rgba(0,149,255,.14); color: var(--blue-pale); font-size: 11px; font-weight: 500; }
.tagline { font-size: 11.5px; line-height: 1.55; color: var(--faint); }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--muted); font-size: 13.5px; text-align: left; }
.nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav button[aria-current="page"] { background: rgba(0,149,255,.16); border-color: rgba(0,149,255,.45); color: #fff; font-weight: 500; }
.nav svg { flex: none; }
.storage-note { margin-top: auto; font-size: 11px; line-height: 1.5; color: var(--faint); border-top: 1px solid var(--line-soft); padding-top: 14px; }
.main-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); padding-inline: 30px; border-bottom: 1px solid var(--line); }
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.crumb { font-size: 11px; color: var(--faint); }
.page-title { font-size: 25px; font-weight: 300; line-height: 1.15; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #00B0F0); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
.progress-chip { display: flex; align-items: center; gap: 9px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.06); font-size: 11px; color: var(--faint); }
.progress-chip b { font-size: 13px; font-weight: 500; color: var(--blue); }
main { padding: 26px 30px 70px; display: flex; flex-direction: column; gap: 22px; max-width: 1360px; width: 100%; }
.mobile-nav { display: none; }

/* ---- generic pieces ---- */
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 24px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card.tight { padding: 18px 20px; gap: 12px; }
.card-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; justify-content: space-between; }
.eyebrow { font-size: 11px; font-weight: 500; color: var(--blue-soft); letter-spacing: .02em; }
.h2 { font-size: 19px; font-weight: 500; }
.h3 { font-size: 15px; font-weight: 500; }
.lead { font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 70ch; }
.small { font-size: 12px; color: var(--muted); }
.tiny { font-size: 11px; color: var(--faint); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 999px; border: 1px solid transparent; background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--blue-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: rgba(255,255,255,.25); color: var(--text); }
.btn.ghost:hover { background: rgba(255,255,255,.07); border-color: var(--blue); }
.btn.small { padding: 8px 15px; font-size: 12px; }
.btn.danger { background: transparent; border-color: rgba(233,67,233,.5); color: #F19BF1; }
.btn.danger:hover { background: rgba(233,67,233,.12); color: #fff; }
.btn.solid-danger { background: var(--quantum); }
.btn.ai { background: linear-gradient(135deg, var(--violet), var(--blue)); }
.btn.ai:hover { filter: brightness(1.1); }
.link { background: none; border: 0; padding: 4px 0; color: var(--blue-soft); font-size: 13px; font-weight: 500; }
.link:hover { color: var(--blue-pale); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.lvl-Essential { background: var(--essential); color: var(--ink); }
.lvl-Proficient { background: var(--blue); color: #fff; }
.lvl-Advanced { background: var(--quantum); color: #fff; }
.lvl-none { background: rgba(255,255,255,.08); color: var(--muted); }
.chip.done { background: var(--done); color: #fff; }
.chip.soft { background: rgba(255,255,255,.07); border-color: var(--line); color: var(--muted); }
.chip.warn { background: rgba(233,67,233,.14); border-color: rgba(233,67,233,.5); color: var(--quantum-pale); }
.chip.info { background: rgba(0,149,255,.14); border-color: rgba(0,149,255,.4); color: var(--blue-pale); }
.chip.ai { background: rgba(108,99,255,.18); border-color: rgba(108,99,255,.5); color: #C9C5FF; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(0,149,255,.35); background: rgba(0,149,255,.08); font-size: 12.5px; line-height: 1.55; }
.notice.warn { border-color: rgba(233,67,233,.5); background: rgba(233,67,233,.09); }
.notice.ok { border-color: rgba(78,167,46,.5); background: rgba(78,167,46,.1); }
.notice.ai { border-color: rgba(108,99,255,.45); background: rgba(108,99,255,.1); }
.notice svg { flex: none; margin-top: 1px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 12.5px; font-weight: 500; }
.input, .select, .textarea { width: 100%; padding: 11px 14px; border: 1px solid rgba(255,255,255,.22); border-radius: var(--radius-s); background: rgba(255,255,255,.055); color: var(--text); outline: none; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,149,255,.18); }
.proc-row { display: flex; gap: 10px; align-items: center; }
.proc-n { width: 28px; height: 28px; flex: none; border-radius: 50%; background: rgba(0,149,255,.16); border: 1px solid rgba(0,149,255,.4); color: var(--blue-pale); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.date-pick { position: relative; }
.date-pick .input { cursor: pointer; padding-right: 48px; }
.date-pick .input::-webkit-calendar-picker-indicator { opacity: 0; position: absolute; right: 0; width: 48px; height: 100%; cursor: pointer; }
.date-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 8px; background: rgba(0,149,255,.16); color: var(--blue-pale); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.date-pick:hover .date-btn { background: rgba(0,149,255,.28); }
.select { padding: 7px 10px; font-size: 12.5px; }
.select option { background: #1b1f22; }
.textarea { resize: vertical; line-height: 1.55; font-size: 13px; }
.check { width: 18px; height: 18px; accent-color: var(--blue); flex: none; margin: 0; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: #1b2026; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 13px; max-width: calc(100vw - 32px); }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 34px 10px; text-align: center; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
main.enter > * { animation: fade .2s ease; }

/* ---- tables ---- */
.table-wrap { overflow-x: auto; }
/* Long data tables scroll inside their own box, so the sideways scrollbar stays on screen
   instead of sitting under the last row; the header row stays visible while scrolling. */
.table-wrap:has(> table.data), .table-wrap:has(> table.matrix) { max-height: min(70vh, 720px); overflow: auto; overscroll-behavior: contain; }
.table-wrap > table.data thead th { position: sticky; top: 0; z-index: 2; background: #121518; padding-top: 4px; }
.table-wrap > table.matrix thead th { position: sticky; top: 0; z-index: 2; background: #121518; }
.table-wrap > table.matrix thead th:first-child { z-index: 3; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--faint); padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.data tr.hl td { background: rgba(233,67,233,.07); }
table.data td.num, table.data th.num { text-align: right; }
.bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; min-width: 60px; flex: 1 1 auto; }
.bar > span { display: block; height: 100%; border-radius: 999px; }

/* ---- stepper ---- */
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 10px 14px; }
.phase { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; position: relative; padding: 4px 4px 6px; background: none; border: 0; color: inherit; border-radius: 12px; cursor: pointer; font: inherit; }
.phase:hover { background: rgba(255,255,255,.05); }
.phase:hover .dot { border-color: var(--blue-soft); }
.phase.locked { cursor: default; }
.phase.locked:hover { background: none; }
.phase.current .dot { box-shadow: 0 0 0 4px rgba(0,149,255,.22); border-color: var(--blue); }
/* A finished phase stays green even when it is the phase you are on; only an in-progress phase is blue. */
.phase.done.current .dot { border-color: var(--done); box-shadow: 0 0 0 4px rgba(78,167,46,.28); }
.phase.done:hover .dot { border-color: var(--done); }
.phases.embedded { border: 0; background: none; padding: 6px 0 0; }
.ci { padding: 0; gap: 0; overflow: hidden; }
.ci-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 24px 28px; }
.ci-body { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(0,149,255,.03), rgba(0,149,255,.08)); }
.ci-status { flex: 0 1 340px; display: flex; gap: 22px; align-items: center; padding: 24px 28px; border-right: 1px solid var(--line); }
.ci-journey { flex: 1 1 520px; min-width: 0; padding: 20px 28px; display: flex; flex-direction: column; gap: 6px; }
.starter { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid rgba(0,149,255,.32); border-radius: 14px; background: rgba(0,149,255,.06); text-align: left; color: inherit; font: inherit; }
.starter:hover { background: rgba(0,149,255,.12); }
.starter.off { border-color: var(--line); background: rgba(255,255,255,.03); opacity: .7; }
.starter-ic { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid; display: flex; align-items: center; justify-content: center; }
@media (max-width: 900px) { .ci-status { border-right: 0; border-bottom: 1px solid var(--line); flex-basis: 100%; } }
.phase .track { position: absolute; top: 15px; height: 2px; }
.phase .track.l { left: 0; right: 50%; margin-right: 18px; }
.phase .track.r { left: 50%; right: 0; margin-left: 18px; }
.phase .dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border: 1.5px solid rgba(255,255,255,.3); background: var(--ink); position: relative; z-index: 1; }
.phase.done .dot { background: var(--done); border-color: var(--done); color: #fff; }
.phase.active .dot { border-color: var(--blue); color: var(--blue-pale); box-shadow: 0 0 0 4px rgba(0,149,255,.16); }
.phase.locked { opacity: .55; }
.phase .pl { font-size: 13px; font-weight: 500; }
.phase .po { font-size: 10.5px; color: var(--faint); line-height: 1.35; }
.phase .ps { font-size: 10.5px; font-weight: 500; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; }
.step { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; }
.step .n { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; border: 1px solid rgba(255,255,255,.3); }
.step.done { color: #fff; border-color: rgba(78,167,46,.6); }
.step.done .n { background: var(--done); border-color: var(--done); }
.step[aria-current="step"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
.step[aria-current="step"] .n { border-color: #fff; background: #fff; color: var(--blue); }
.step:not(:disabled):hover { border-color: var(--blue); color: #fff; }
.step:disabled { opacity: .45; cursor: not-allowed; }

/* ---- home ---- */
.hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); background-image: radial-gradient(70% 140% at 100% 0%, rgba(0,149,255,.22) 0%, rgba(108,99,255,.10) 45%, rgba(13,15,16,0) 75%); display: flex; flex-wrap: wrap; align-items: stretch; }
.hero-text { flex: 1 1 360px; min-width: 0; padding: 30px 32px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.hero-title { font-size: 30px; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }
.mark { flex: 0 1 220px; min-width: 170px; align-self: center; position: relative; aspect-ratio: 1/1; max-width: 100%; margin: 16px 8px; display: flex; align-items: center; justify-content: center; }
.mark .glow { position: absolute; inset: 4%; border-radius: 999px; background: radial-gradient(circle at 50% 55%, rgba(0,149,255,.45) 0%, rgba(108,99,255,.18) 45%, rgba(13,15,16,0) 70%); filter: blur(6px); animation: glow 6s ease-in-out infinite; }
.mark .pulse { position: absolute; inset: 16%; border-radius: 999px; border: 1.5px solid rgba(102,190,255,.55); animation: pulse 3.6s cubic-bezier(.2,.6,.3,1) infinite; }
.mark .pulse.b { animation-delay: 1.8s; }
.mark .orbit { position: absolute; inset: 5%; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); animation: orbit 24s linear infinite; }
.mark .orbit.in { inset: 15%; border-style: dashed; border-color: rgba(255,255,255,.16); animation: orbit-rev 32s linear infinite; }
.mark .sat { position: absolute; border-radius: 999px; }
.mark img { position: relative; width: 62%; height: auto; filter: drop-shadow(0 14px 26px rgba(0,149,255,.35)); animation: bob 7s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: .95; transform: scale(1.04); } }
@keyframes pulse { 0% { transform: scale(.62); opacity: .55; } 100% { transform: scale(1.08); opacity: 0; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes orbit-rev { from { transform: rotate(360deg); } to { transform: rotate(0); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.stats { flex: 1 1 320px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-left: 1px solid var(--line-soft); }
.stat { display: flex; align-items: center; gap: 14px; padding: 22px 24px; border: 0; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); background: transparent; text-align: left; color: inherit; }
.stat:hover { background: rgba(255,255,255,.05); }
.stat .ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.stat .v { font-size: 26px; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); }
.donut { position: relative; width: 116px; height: 116px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.donut::before { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: #111517; }
.donut span { position: relative; font-size: 24px; }
.kv { display: flex; flex-direction: column; gap: 3px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; padding-bottom: 0; }
.kv .k { font-size: 11.5px; color: var(--faint); }
.kv .v { font-size: 15px; font-weight: 500; }
.two-col { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.two-col > .wide { flex: 999 1 560px; min-width: 0; }
.two-col > .narrow { flex: 1 1 300px; min-width: 0; }

/* ---- persona cards and questions ---- */
.pcard { display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.035); }
.pcard.on { border-color: var(--blue); background: rgba(0,149,255,.1); }
.pcard label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.initials { width: 52px; height: 52px; flex: none; border-radius: 50%; background: radial-gradient(120% 120% at 20% 10%, #66BEFF 0%, #0095FF 45%, #6C63FF 100%); border: 2px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; }
.initials.sm { width: 32px; height: 32px; font-size: 11px; border-width: 1px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12.5px; }
.tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.tab .tick { color: var(--done); font-weight: 700; }
.tab[aria-selected="true"] .tick { color: #fff; }
.q { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line-soft); }
.q p { flex: 1 1 320px; font-size: 13px; color: var(--muted); }
.q.off p { opacity: .45; }
.yn { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.yn button { padding: 7px 16px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.yn button[aria-pressed="true"].yes { background: var(--done); color: #fff; }
.yn button[aria-pressed="true"].no { background: var(--quantum); color: #fff; }
.yn button:disabled { opacity: .4; cursor: not-allowed; }
.domain { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.03); }

/* ---- mode panels ---- */
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.mode-panel { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.mode-panel .ph { padding: 11px 14px; background: rgba(255,255,255,.05); display: flex; flex-direction: column; gap: 3px; }
.mode-panel .pb { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.mode-panel.above { border-style: dashed; border-color: rgba(233,67,233,.45); }
.opt { display: flex; align-items: center; gap: 9px; padding: 6px 6px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.opt:hover { background: rgba(255,255,255,.05); }
.opt.on { background: rgba(0,149,255,.12); }
.opt .flag { margin-left: auto; font-size: 10.5px; color: var(--quantum-pale); font-weight: 500; white-space: nowrap; }
.opt .meta { display: block; font-size: 10.5px; color: var(--faint); }

/* ---- upload, classify, map ---- */
.drop { border: 1.5px dashed rgba(0,149,255,.5); border-radius: var(--radius); background: rgba(0,149,255,.06); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer; }
.drop.over { background: rgba(0,149,255,.14); border-color: var(--blue-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.matrix { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: 100%; }
.matrix th, .matrix td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; position: sticky; left: 0; background: #121518; z-index: 1; min-width: 220px; }
.matrix thead th { font-size: 11px; font-weight: 500; color: var(--muted); vertical-align: bottom; }
.matrix .grp td { background: rgba(255,255,255,.04); font-weight: 500; font-size: 12px; text-align: left; }
.via { font-size: 10px; color: var(--faint); display: block; }

/* ---- learning path journey ---- */
.jscroll { position: relative; display: flex; flex-direction: column; gap: 14px; }
.jbar { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(0,149,255,.07); }
.jscroll.fits .jbar { display: none; }
.jnav { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: rgba(13,15,16,.6); color: #fff; display: flex; align-items: center; justify-content: center; transition: background .2s ease, box-shadow .2s ease, opacity .2s ease, transform .2s ease; }
.jnav:not(:disabled):hover { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 18px rgba(0,149,255,.55); transform: scale(1.06); }
.jnav:disabled { opacity: .3; cursor: default; }
.jtrack { position: relative; flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); cursor: pointer; touch-action: none; }
.jtrack:focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 4px; }
.jthumb { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: #0095FF; box-shadow: 0 0 12px rgba(0,149,255,.5); cursor: grab; transition: left .12s ease-out; }
.jscroll.dragging .jthumb { cursor: grabbing; transition: none; box-shadow: 0 0 18px rgba(0,149,255,.75); }
.jcount { flex: none; min-width: 112px; text-align: center; font-size: 11.5px; font-weight: 500; letter-spacing: .02em; color: var(--blue-pale); font-variant-numeric: tabular-nums; }
/* Hide the native bar; fade the edges that have more to show. */
.journey { position: relative; padding: 14px 2px 6px; overflow-x: auto; scroll-snap-type: x proximity; scroll-behavior: smooth; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%); }
.journey::-webkit-scrollbar { display: none; }
.jscroll.at-start .journey { -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 56px), transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 56px), transparent 100%); }
.jscroll.at-end .journey { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 100%); mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 100%); }
.jscroll.fits .journey, .jscroll.at-start.at-end .journey { -webkit-mask-image: none; mask-image: none; }
.jstep { scroll-snap-align: start; scroll-margin-left: 4px; }
/* Six equal columns; each dot sits centred over its column and the line runs from the first dot to the last. */
.journey-track { --gap: 16px; display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: var(--gap); position: relative; min-width: 1040px; }
.journey-line { position: absolute; top: 20px; height: 4px; border-radius: 4px; left: calc((100% - 5 * var(--gap)) / 12); right: calc((100% - 5 * var(--gap)) / 12);
  background: linear-gradient(90deg, rgba(255,255,255,.32) 0 30%, var(--blue) 30% 50%, var(--quantum) 50% 90%, #fff 90% 100%); }
.jstep { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.jdot { align-self: center; flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: var(--ink); border: 3px solid rgba(255,255,255,.45); color: #fff; z-index: 1; margin-bottom: 18px; box-shadow: 0 0 0 6px var(--ink); }
.jstep[data-k="build"] .jdot { border-color: var(--blue); color: var(--blue-pale); }
.jstep[data-k="confidence"] .jdot, .jstep[data-k="prove"] .jdot { border-color: var(--quantum); color: var(--quantum-pale); }
.jstep[data-k="sustain"] .jdot { border-color: #fff; }
.jcard { flex: 1; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.045); padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; }
.jcard .jt { font-size: 13.5px; font-weight: 600; }
.jcard .jv { font-size: 11.5px; color: var(--muted); font-style: italic; }
.jitem { display: flex; flex-direction: column; gap: 2px; padding: 7px 9px; border-radius: 9px; background: rgba(255,255,255,.05); font-size: 12px; }
.jitem .jl { font-weight: 500; }
.jitem .jm { display: flex; justify-content: space-between; gap: 6px; align-items: center; min-height: 22px; }
.jitem input { width: 62px; padding: 3px 6px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); text-align: right; }
.jitem.edited input { border-color: var(--blue-soft); }
.jweeks { font-size: 10.5px; color: var(--blue-pale); font-weight: 500; }
.jtime { font-size: 11px; color: var(--faint); margin-top: auto; }
.tailored { display: grid; grid-template-columns: 170px repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tailored > div { padding: 12px 16px; font-size: 12px; color: var(--muted); }
.tailored > div:first-child { background: #fff; color: var(--ink); font-weight: 600; display: flex; align-items: center; }
.tailored b { display: block; font-size: 13px; margin-bottom: 2px; }
.gantt-app { min-width: 820px; border-top: 1px solid var(--line); }
.gantt-app .g-row { display: grid; grid-template-columns: 250px repeat(11, minmax(44px, 1fr)); border-bottom: 1px solid var(--line); }
.gantt-app .g-row > * { grid-row: 1; }
.gantt-app .g-head { border-bottom-color: rgba(255,255,255,.18); }
.gantt-app .g-h { font-size: 11px; color: var(--faint); text-align: center; padding: 8px 0; }
.gantt-app .g-h.go { color: var(--done); font-weight: 500; }
.gantt-app .g-lbl { padding: 10px 14px 10px 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.gantt-app .g-lbl b { font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.gantt-app .g-lbl b i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.gantt-app .g-assets { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
.gantt-app .g-assets em { font-style: normal; color: var(--faint); }
.gantt-app .g-cell { border-left: 1px dashed rgba(255,255,255,.06); }
.gantt-app .g-cell.go { border-left: 2px solid var(--done); }
.gantt-app .g-bar { align-self: center; height: 24px; margin: 0 3px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; z-index: 1; color: #fff; }
.gantt-app .k-understand, .gantt-app .k-role { background: rgba(255,255,255,.45); color: #0D0F10; }
.gantt-app .k-build { background: var(--blue); }
.gantt-app .k-confidence, .gantt-app .k-prove { background: var(--quantum); }
.gantt-app .k-sustain { background: #fff; color: #0D0F10; }

/* ---- document preview ---- */
.paper-wrap { border-radius: 12px; background: #C9D1DA; padding: 18px; max-height: 760px; overflow: auto; }
.paper { max-width: 820px; margin: 0 auto; background: #fff; color: #14202E; padding: 40px 44px; box-shadow: 0 6px 24px rgba(5,7,13,.3); }

/* ---- responsive ---- */
@media (max-width: 900px) {
  .side { display: none; }
  .mobile-nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-soft); }
  .mobile-nav button { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; }
  .mobile-nav button[aria-current="page"] { background: rgba(0,149,255,.16); border-color: rgba(0,149,255,.5); color: #fff; }
  main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
  .topbar { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .phases { grid-template-columns: repeat(5, minmax(56px, 1fr)); overflow-x: auto; }
  .phase .po { display: none; }
  .stats { border-left: 0; border-top: 1px solid var(--line-soft); }
  .card { padding: 18px 16px; }
  .tailored { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.dev-row { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(220px, 1.6fr) minmax(180px, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
@media (max-width: 820px) { .dev-row { grid-template-columns: 1fr; } }

/* ---- Rafiq (AI assistant) ---- */
.rafiq-mark { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(0,149,255,.18); color: #fff; font-weight: 700; line-height: 1; letter-spacing: 0; font-family: inherit; }
.rafiq-card { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 14px; border: 1px solid rgba(0,149,255,.35); background: rgba(0,149,255,.06); }
.rafiq-head { display: flex; align-items: center; gap: 10px; }
.rafiq-head b { font-weight: 500; font-size: 14px; }
.rafiq-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid rgba(0,149,255,.18); }
