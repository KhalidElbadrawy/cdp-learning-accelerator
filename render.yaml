services:
  - type: web
    name: cdp-learning-accelerator
    runtime: node
    plan: free
    branch: main
    # Every push to main redeploys automatically.
    autoDeploy: true
    # Tests run first: if they fail, the deploy stops and the current live version stays up.
    buildCommand: npm ci && npm test && node tools/build.mjs
    startCommand: node server.mjs
    healthCheckPath: /api/rafeeq/status
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # Render asks for the value when you apply the blueprint
      - key: ACCESS_CODE
        sync: false   # optional: a code visitors enter before Rafeeq answers
